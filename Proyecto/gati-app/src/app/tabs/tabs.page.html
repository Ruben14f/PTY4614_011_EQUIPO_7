<ion-split-pane contentId="main-content">

  <!-- MENÚ LATERAL -->
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar color="tertiary">
        <ion-title class="ion-text-center" style="font-weight: 700;">GATI MOP</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="none" class="ion-padding-top">
        <ion-menu-toggle auto-hide="false">

          <ion-item routerLink="/tabs/tab1" routerDirection="root" class="menu-item">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item button routerLink="/tabs/inventario" routerDirection="root" class="menu-item" menuClose>
            <ion-icon slot="start" name="cube-outline"></ion-icon>
            <ion-label>Inventario</ion-label>
          </ion-item>

          <ion-item button class="menu-item">
            <ion-icon slot="start" name="document-text-outline"></ion-icon>
            <ion-label>Órdenes de Compra</ion-label>
          </ion-item>

          <ion-item button class="menu-item">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Administración</ion-label>
          </ion-item>

        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- CONTENEDOR PRINCIPAL (Aquí se carga el Dashboard) -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-split-pane>
